name: MovieHub CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DB_PASSWORD: ci-test-password
      JWT_SECRET: ci-test-secret-key-for-moviehub-only-0123456789abcdef
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/moviehub
      SPRING_DATASOURCE_USERNAME: root

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password
          MYSQL_DATABASE: moviehub
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run tests
        run: chmod +x mvnw && ./mvnw test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moviehub-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn